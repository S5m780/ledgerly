<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Inter, Arial, sans-serif" font-size="13">
  <rect width="900" height="340" fill="#fafafa"/>
  <g stroke="#333" stroke-width="1.5" fill="#fff">
    <rect x="30" y="110" width="120" height="80" rx="8"/>
    <rect x="240" y="100" width="110" height="50" rx="8"/>
    <rect x="430" y="80" width="230" height="140" rx="8"/>
    <rect x="740" y="110" width="130" height="80" rx="8"/>
    <rect x="480" y="260" width="130" height="50" rx="8"/>
  </g>
  <g font-weight="600" text-anchor="middle">
    <text x="90" y="135">12 V adapter</text><text x="90" y="153" font-weight="400">5.5×2.1 jack</text>
    <text x="295" y="122">Rocker switch</text><text x="295" y="140" font-weight="400">spin / hold</text>
    <text x="545" y="105">PWM speed controller</text><text x="545" y="123" font-weight="400">12 V, ≥ 2 A</text>
    <text x="805" y="140">JGY-370</text><text x="805" y="158" font-weight="400">worm-gear motor</text>
    <text x="545" y="283">Speed knob</text><text x="545" y="300" font-weight="400">B10K panel pot</text>
  </g>
  <g stroke="#d33" stroke-width="3" fill="none">
    <path d="M150 130 H240"/><path d="M350 130 H430"/><path d="M660 130 H740"/>
  </g>
  <g stroke="#222" stroke-width="3" fill="none">
    <path d="M150 170 H430"/><path d="M660 170 H740"/>
  </g>
  <g stroke="#2a7" stroke-width="2" fill="none">
    <path d="M520 220 V260"/><path d="M545 220 V260"/><path d="M570 220 V260"/>
  </g>
  <g font-size="11" fill="#444">
    <text x="160" y="124">+</text><text x="160" y="184">−</text>
    <text x="436" y="126">VIN+</text><text x="436" y="166">VIN−</text>
    <text x="616" y="126">M+</text><text x="616" y="166">M−</text>
    <text x="500" y="240">CW</text><text x="533" y="240">W</text><text x="560" y="240">CCW</text>
    <text x="30" y="40" font-size="14" font-weight="600" fill="#222">Whatnot turntable — wiring</text>
    <text x="30" y="60">Switch breaks the + rail: OFF = plate holds still (worm gear self-locks), ON = spin at the knob's speed.</text>
    <text x="30" y="325">Swap M+/M− to reverse direction. Ratio 3:1 → 15 RPM motor gives 2–5 RPM at the plate.</text>
  </g>
</svg>
